<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zevce Shoes — IBAN Bilgileri</title>
<style>
:root{--bg:#F7F3EC;--card:#fff;--ink:#1F2328;--gold:#9A7B4F;--line:#E6DDCD}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Avenir Next",Arial,sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:36px 18px 48px}
h1{font-family:Didot,"Bodoni 72","Times New Roman",serif;font-weight:400;font-size:34px;text-align:center;margin:0}
.sub{text-align:center;color:var(--gold);letter-spacing:4px;font-size:13px;text-transform:uppercase;margin:8px 0 26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.lbl{font-size:12px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:6px}
.val{font-size:20px;font-weight:600;word-break:break-word;line-height:1.35}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
button{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:11px 16px;font:inherit;font-size:15px;cursor:pointer;flex:none}
button.done{background:#1E7B34}
.note{font-size:13px;color:#6B6258;text-align:center;margin-top:22px;line-height:1.5}
a{color:var(--gold)}
</style></head>
<body><div class="wrap">
<h1>Zevce Shoes</h1>
<div class="sub">IBAN Bilgileri</div>
<div class="card"><div class="lbl">Banka</div><div class="val">Garanti BBVA</div></div>
<div class="card"><div class="lbl">Alıcı</div><div class="row"><div class="val" id="h1">Harun Reşit Kurt</div><button data-copy="h1">Kopyala</button></div></div>
<div class="card"><div class="lbl">IBAN</div><div class="row"><div class="val" id="i1">TR14 0006 2000 5270 0006 8710 60</div><button data-copy="i1">Kopyala</button></div></div>

<p class="note">Havale / EFT yaparken IBAN ve alıcı adını kontrol edin.</p>
</div>
<script>
document.querySelectorAll('button[data-copy]').forEach(function(b){
  b.addEventListener('click',function(){
    var t=document.getElementById(b.dataset.copy).innerText.trim();
    var done=function(){b.textContent='Kopyalandı';b.classList.add('done');setTimeout(function(){b.textContent='Kopyala';b.classList.remove('done')},1600)};
    var fb=function(){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){}a.remove()};
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,fb)}else{fb()}
  });
});
</script></body></html>
